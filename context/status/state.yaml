# Rendered by context/process/render_state.py through context/process/templates/*.tpl.md (one template per region):
#   PYTHONIOENCODING=utf-8 python3 -B context/process/render_state.py --check   MATCH|DIFF per region and per file against the live files; exit 1 on a DIFF or a cap breach
#   PYTHONIOENCODING=utf-8 python3 -B context/process/render_state.py --probe   every anchor, cap and region assert --write runs; the would-be bytes; writes NOTHING
#   PYTHONIOENCODING=utf-8 python3 -B context/process/render_state.py --write   the probe, then the regions written by anchor (the hub's beat runs it)
# THE RULE: edit here, then render — never edit the rendered regions by hand. From v108 b1 `--check` runs at every boot (the orchestrator prompt §1.4b);
# a DIFF names a region hand-cut since this file. A beat: edit this file → `--probe` → `--write` → `--check` 7 MATCH → the splice (`beat()` with
# `state_path` renders the same bytes again) → `--check` 7 MATCH after the beat.
# Form (the hub edits this by hand and reads it back by eye): every string double-quoted (an inner " written \"); no anchors, no flow
# style, no multi-line scalars, no key written twice; a value is ONE line and never carries `@@`. A scalar fills the slot `@@key@@`
# (nested keys joined by `.`); a list key always holds at least one item (`held` one row; "nothing" is one item such as "none").
# A list renders by ONE str.join into the slot of its key — the separator per key is the SEPS table in render_state.py; a words line's
# closing period and its bold label live in the template, never in the list. `held` is the one list of rows: each row is
# {lane, state, next}, the three cells VERBATIM (the renderer adds only the leading `| `, the ` | ` separators and the trailing ` |`);
# a cell never carries a `|`. EVERY key here is read by a template: a key no template reads is REFUSED by name, so a slot removed from a
# template is removed here in the same edit. Every day-name below is written from the calendar (D-v107-25), never inherited.
