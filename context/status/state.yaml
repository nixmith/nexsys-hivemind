# Rendered by context/process/render_state.py through context/process/templates/*.tpl.md (one template per region):
#   PYTHONIOENCODING=utf-8 python3 -B context/process/render_state.py --check   MATCH|DIFF per region and per file against the live files; exit 1 on a DIFF or a cap breach
#   PYTHONIOENCODING=utf-8 python3 -B context/process/render_state.py --probe   every anchor, cap and region assert --write runs; the would-be bytes; writes NOTHING
